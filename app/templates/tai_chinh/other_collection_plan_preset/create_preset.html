{% extends 'tai_chinh/tai_chinh_base.html' %}
{% load static %}
{% block title %}Thêm thiết lập khoản thu{% endblock %}
{% block content %}

<div class="card shadow mb-4">
  <div class="card-header py-3">
      <h4 class="m-0 font-weight-bold text-primary">Thêm thiết lập khoản thu</h4>
  </div>
  <div class="card-body">
        <form method="POST" action="{% url 'create_plan_preset' %}">
            {% csrf_token %}
            <div class="row">
              <div class="col-6">
                <div class="form-group mt-2">
                  <label class="fw-bold  ">Hệ đào tạo</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <img class="custom-image-size" src="{% static 'images/hedaotao.png' %}" alt="Image">
                      </span>
                    </div>
                  <select class="form-control combobox" id="study_program" name="study_program" onchange="handleComboboxChange1()" required>
                    <option value=""></option>
                    {% for value in study_programs %}
                        <option value="{{ value.id }}">{{ value.study_program_name }}</option>
                    {% endfor %}
                </select>
                </div>
                </div>
                <div class="form-group mt-2">
                  <label class="fw-bold  ">Faculty</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <img class="custom-image-size" src="{% static 'images/khoa.png' %}" alt="Image">
                      </span>
                    </div>
                  <select class="form-control combobox" name="faculty" id="faculty" onchange="handleComboboxChange1()">
                    <option value="">Tất cả các khoa</option>
                    {% for value in faculties %}
                        <option value="{{ value.id }}">{{ value.faculty_name }}</option>
                    {% endfor %}
                    </select>
                </div>
                </div>
                <div class="form-group mt-2">
                  <label class="fw-bold  ">Tên khoản</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <img class="custom-image-size" src="{% static 'images/khoanThu.png' %}" alt="Image">
                      </span>
                    </div>
                  <input class="form-control" name="payment_name"></input>
                  </div>
                </div>

                <div class="form-group mt-2">
                  <label class="fw-bold  ">Số tiền</label>
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <img class="custom-image-size" src="{% static 'images/muchocphi.png' %}" alt="Image">
                      </span>
                    </div>
                  <input type="text" class="form-control" name="payment_amount" id="currency-field" value="" data-type="currency" required>
                </div>
                </div>

                <div class="form-group mt-2">
                  <label class="fw-bold  ">Nội dung</label>
                  <textarea class="form-control" name="description" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary mt-3">Xác nhận</button>
                <a class="btn btn-danger mt-3" href="{% url 'preset_list' %}">Hủy</a>
              </div>
          </div>
        </form>
      </div>
 
</div>
<script src="{% static 'js/convert_currency.js' %}"></script>

<script>
  function handleComboboxChange1() {
    var cmb_study_program = document.getElementById('study_program');
    var cmb_major = document.getElementById('tenNganh');
    var cmb_faculty = document.getElementById('faculty');
    var selected_study_program = cmb_study_program.value;
    var selected_faculty = cmb_faculty.value;
    
    cmb_major.innerHTML = '';
    
    {% for value in majors %}
      if ("{{ value.study_program.study_program_name }}" == selected_study_program && "{{ value.faculty.faculty_name }}" == selected_faculty) {
        var newOption = document.createElement('option');
        newOption.value = "{{ value.major_name }}";
        newOption.textContent = "{{ value.major_name }}";
        cmb_major.appendChild(newOption);
      }
    {% endfor %}
    var cmbKhoaHoc = document.getElementById('year');
    var cmbLop = document.getElementById('class_name');
    var selectedNganhDaoTao = cmb_major.value;
    
    cmbLop.innerHTML = '';
    
    console.log(selectedNganhDaoTao);
    {% for value in student_classes %}
      if ("{{ value.major.major_name }}" == selectedNganhDaoTao) {
        var newOption = document.createElement('option');
        newOption.value = "{{ value.class_name }}";
        newOption.textContent = "{{ value.class_name }}";
        cmbLop.appendChild(newOption);
      }
    {% endfor %}
  }
</script>

{% endblock %}
